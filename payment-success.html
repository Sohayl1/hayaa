<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم الدفع بنجاح | حَيَاه</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f0fdf4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.1);
      text-align: center;
      max-width: 480px;
      width: 100%;
      border: 1.5px solid #bbf7d0;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #dcfce7;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 { color: #166534; font-size: 24px; font-weight: 800; margin: 0 0 12px; }
    p { color: #475569; font-size: 15px; margin: 0 0 24px; line-height: 1.6; }
    .btn {
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <h1>تم تأكيد الدفع والحجز بنجاح!</h1>
    <p>تم تسجيل موعدك في النظام وإشعار الطبيب مباشرة. يمكنك الآن العودة لمتابعة تفاصيل الكشف والروشتة الطبية.</p>
    <a href="/index.html" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      <span>العودة للرئيسية</span>
    </a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const apptId = params.get('appointmentId');
    const token = localStorage.getItem('token');
    if (apptId && token) {
      fetch(`/api/appointments/${apptId}/pay-mock`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      }).catch(console.error);
    }
  </script>
</body>
</html>
