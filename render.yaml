services:
  - type: web
    name: hayaa-health
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://hayaa-health.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hayaa-db
          property: connectionString

databases:
  - name: hayaa-db
    plan: free
    region: frankfurt
    databaseName: hayaadb
    user: hayaa
